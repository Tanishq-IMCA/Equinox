{% extends "base.html" %}
{% block container_class %}centered{% endblock %}
{% block content %}
<div class="glass-panel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; text-align: center; width: 600px;">
    <i class="fa-solid fa-hammer" style="font-size: 4rem; color: var(--accent-color); margin-bottom: 20px;"></i>
    <div class="title-underline-wrapper" style="align-items: center;">
        <h2 class="reflect-text" data-text="DEVELOPMENT IN PROGRESS" style="font-family: var(--font-title); font-size: 2.5rem; color: white; letter-spacing: 2px; margin-bottom: 0;">DEVELOPMENT IN PROGRESS</h2>
        <div class="themed-wave-line" style="height: 5px;"></div>
    </div>
    <p style="color: var(--text-muted); font-size: 1rem; max-width: 400px; margin-top: 20px;">This module is currently under construction for the AURA Health Arena sanctuary.</p>
</div>
{% endblock %}
